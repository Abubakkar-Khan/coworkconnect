<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CoWorkConnect</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/icons/briefcase-fill.svg">
</head>
<body style="background-color: var(--bg-soft);">
    <!-- Shared Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i data-lucide="layout"></i>
                <span>CoWorkConnect</span>
            </a>
            <div class="nav-links">
                <a href="spaces.html" class="nav-link">Explore Spaces</a>
                <a href="community.html" class="nav-link">Networking</a>
                <a href="groups.html" class="nav-link">Groups</a>
                <a href="events.html" class="nav-link">Events</a>
                
                <div id="auth-links" class="auth-links hidden"></div>
                <div id="user-links" class="user-links hidden" style="border-left: 1px solid #eee; padding-left: 1.5rem; margin-left: 1rem;">
                    <!-- Populated dynamically by app.js -->
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 140px; padding-bottom: 50px;">
        <div style="display: grid; grid-template-columns: 350px 1fr; gap: 2rem; align-items: start;">
            <!-- Left: Avatar Card -->
            <div style="background: white; padding: 3rem; border-radius: 24px; border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow);">
                <div style="width: 120px; height: 120px; background: #ecfdf5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--primary); border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <i data-lucide="user" size="60"></i>
                </div>
                <h2 id="display-name" style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem;">User Name</h2>
                <p id="display-email" style="color: var(--gray); font-weight: 600; margin-bottom: 2rem; font-size: 0.95rem;">user@example.com</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; border-top: 1px solid #f1f5f9; padding-top: 2rem;">
                    <div><span style="display: block; font-size: 1.4rem; font-weight: 800; color: var(--primary);">12</span><span style="font-size: 0.75rem; color: var(--gray); font-weight: 700; text-transform: uppercase;">Bookings</span></div>
                    <div><span style="display: block; font-size: 1.4rem; font-weight: 800; color: var(--primary);">4</span><span style="font-size: 0.75rem; color: var(--gray); font-weight: 700; text-transform: uppercase;">Events</span></div>
                </div>
            </div>

            <!-- Right: Account Fields -->
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                <div style="background: white; padding: 2.5rem; border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow);">
                    <h3 style="margin-bottom: 2rem; display: flex; align-items: center; gap: 0.8rem; font-weight: 800;">
                        <i data-lucide="settings" size="24" color="var(--primary)"></i> Account Portfolio
                    </h3>
                    <form id="profile-form">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="input-group"><label>Full Name</label><input type="text" id="profile-name" class="input-field" style="border-radius: 12px; padding: 0.8rem 1rem;"></div>
                            <div class="input-group"><label>Email Address</label><input type="email" id="profile-email" class="input-field" style="border-radius: 12px; padding: 0.8rem 1rem;"></div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="input-group">
                                <label>Current Status</label>
                                <select id="profile-status" class="input-field" style="border-radius: 12px; padding: 0.8rem 1rem;">
                                    <option value="Available">Available</option>
                                    <option value="Busy">Focus Mode</option>
                                    <option value="Networking">Open to Collab</option>
                                    <option value="Out">Off-site</option>
                                </select>
                            </div>
                            <div class="input-group"><label>Catchy Bio</label><textarea id="profile-bio" class="input-field" placeholder="Software Engineer @ Apple" style="height: 52px; resize: none; border-radius: 12px; padding: 0.8rem 1rem;"></textarea></div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="padding: 1rem 3rem; font-weight: 800; border-radius: 12px; margin-top: 1rem;">Update Portfolio</button>
                    </form>
                </div>
                <div style="background: white; padding: 2.5rem; border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow);">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; font-weight: 800;"><i data-lucide="award" size="24" color="var(--primary)"></i> My Expertise</h3>
                    <div id="skills-container" style="display: flex; flex-wrap: wrap; gap: 0.7rem; margin-bottom: 1.5rem;"></div>
                    <div style="display: flex; gap: 1rem;"><input type="text" id="skill-input" class="input-field" placeholder="Add Skill (e.g. React)" style="border-radius: 12px;"><button id="add-skill-btn" class="btn btn-outline" style="padding: 0 2rem; border-radius: 12px; font-weight: 800;">Add</button></div>
                </div>
            </div>
        </div>
    </main>
<script src="app.js?v=route-images-1"></script>
    <script>
        lucide.createIcons();
        async function loadProfile() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'index.html'; return; }
            try {
                const res = await fetch('/api/users/profile', { headers: { 'Authorization': `Bearer ${token}` } });
                const result = await res.json();
                const user = result.data;
                document.getElementById('display-name').textContent = user.name;
                document.getElementById('display-email').textContent = user.email;
                document.getElementById('profile-name').value = user.name || '';
                document.getElementById('profile-email').value = user.email || '';
                document.getElementById('profile-status').value = user.status || 'Available';
                document.getElementById('profile-bio').value = user.bio || '';
                localStorage.setItem('user', JSON.stringify(user));
                updateNavbar();
            } catch (err) { console.error(err); }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const payload = { name: document.getElementById('profile-name').value, email: document.getElementById('profile-email').value, status: document.getElementById('profile-status').value, bio: document.getElementById('profile-bio').value };
            const res = await fetch('/api/users/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(payload) });
            if (res.ok) { alert('Portfolio updated successfully!'); loadProfile(); }
        });

        const skillsContainer = document.getElementById('skills-container');
        const skillInput = document.getElementById('skill-input');
        const addSkillBtn = document.getElementById('add-skill-btn');
        let skills = ['UI/UX Design', 'Project Management'];

        function renderSkills() {
            skillsContainer.innerHTML = skills.map(s => `<span style="background: #f0fdf4; color: var(--primary); padding: 0.6rem 1.2rem; border-radius: 50px; font-size: 0.9rem; font-weight: 800; display: flex; align-items: center; gap: 8px;">${escapeHtml(s)} <button type="button" class="btn-icon remove-skill" data-skill="${escapeHtml(s)}" aria-label="Remove ${escapeHtml(s)}"><i data-lucide="x" size="14"></i></button></span>`).join('');
            skillsContainer.querySelectorAll('.remove-skill').forEach((button) => {
                button.addEventListener('click', () => removeSkill(button.dataset.skill));
            });
            lucide.createIcons();
        }

        addSkillBtn.addEventListener('click', () => { if(skillInput.value) { skills.push(skillInput.value); skillInput.value = ''; renderSkills(); } });
        window.removeSkill = (s) => { skills = skills.filter(item => item !== s); renderSkills(); };
        document.addEventListener('DOMContentLoaded', () => { loadProfile(); renderSkills(); });
    </script>

    <!-- Footer -->
        <footer class="footer" style="padding: 2rem 0; background-color: var(--color-surface); border-top: 1px solid var(--color-border); text-align: center; color: var(--color-muted); font-size: 0.85rem; font-weight: 600;">
        <div class="container">
            <p>&copy; 2026 CoWorkConnect. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
